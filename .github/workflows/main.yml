name: Build

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  CONFIGURATION: Release
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10'

      - name: Restore NuGet packages
        run: dotnet restore Stratum.sln

      - name: Run tests
        run: dotnet test --configuration $env:CONFIGURATION --no-restore Stratum.Test/Stratum.Test.csproj

      - name: Build Windows app
        run: dotnet build --configuration $env:CONFIGURATION --no-restore -p:Platform=x64 Stratum.Windows/Stratum.Windows.csproj
